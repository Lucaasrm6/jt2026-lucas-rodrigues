<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500">
<title>Proxy temporal: transição líquida de calendário padronizada por lead-time</title>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:24px;font-weight:700}.sub{font-size:14px;fill:#5b6576}.label{font-size:14px}.small{font-size:12px;fill:#5b6576}.value{font-size:13px;font-weight:700}</style>
<text x="55" y="48" class="title" text-anchor="start">Teste de robustez temporal — janela 07→20 jan (13 dias)</text>
<text x="55" y="74" class="sub" text-anchor="start">Transição líquida do estado do calendário, padronizada por lead-time. Não é ocupação.</text>
<text x="195" y="153" class="label" text-anchor="end">Morretes 2Q</text>
<rect x="220" y="125" width="329.6428571428571" height="40" rx="4" fill="#2563eb"/>
<text x="561.6428571428571" y="152" class="value" text-anchor="start">7,1%</text>
<text x="195" y="235" class="label" text-anchor="end">Meia Praia 2Q</text>
<rect x="220" y="207" width="524.6428571428571" height="40" rx="4" fill="#0f766e"/>
<text x="756.6428571428571" y="234" class="value" text-anchor="start">11,3%</text>
<text x="195" y="317" class="label" text-anchor="end">Centro 2Q</text>
<rect x="220" y="289" width="566.4285714285713" height="40" rx="4" fill="#0f766e"/>
<text x="798.4285714285713" y="316" class="value" text-anchor="start">12,2%</text>
<rect x="55" y="380" width="870" height="78" rx="7" fill="#eef2f7"/>
<text x="75" y="404" class="label" text-anchor="start">Leitura: Morretes 2Q tem a menor transição líquida entre os 2Q comparados (7,1% vs 11,3% e 12,2%).</text>
<text x="75" y="428" class="small" text-anchor="start">Esse sinal fraco não favorece Morretes, mas desaparecimento de data não comprova reserva e o proxy não mede</text>
<text x="75" y="447" class="small" text-anchor="start">o diferencial de ocupação de &gt;20% que inverteria a recomendação. Por isso permanece evidência suplementar.</text>
</svg>
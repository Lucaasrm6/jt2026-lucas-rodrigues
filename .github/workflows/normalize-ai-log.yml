name: normalize-ai-log-header

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize AI log header
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('ai-log/01_ai_log.md')
          text = p.read_text(encoding='utf-8')
          marker = '\n---\n'
          if marker not in text:
              raise SystemExit('Separador inicial não encontrado; nenhuma alteração feita.')
          _, rest = text.split(marker, 1)
          header = (
              '# AI Log — sessão de trabalho com IA\n\n'
              '> Registro dos prompts e respostas utilizados no desenvolvimento analítico do case. '
              'As respostas do **Claude Code** são apresentadas literalmente. Quando uma conclusão '
              'foi revisada durante o processo, a correção aparece no ciclo subsequente.\n'
          )
          p.write_text(header + marker + rest, encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/normalize-ai-log.yml
          git add ai-log/01_ai_log.md
          git commit -m "docs: normalize AI log presentation"
          git push

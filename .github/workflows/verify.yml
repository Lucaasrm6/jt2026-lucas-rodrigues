name: verify-analysis

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Reproduce final analysis
        run: python analysis/run_final_analysis.py

      - name: Run temporal robustness test
        run: python analysis/temporal_proxy.py

      - name: Run decision robustness and buy-box screen
        run: python analysis/decision_robustness.py

      - name: Regenerate decision figures
        run: python analysis/generate_figures.py

      - name: Run final consistency gate
        run: python scripts/consistency_gate_final.py

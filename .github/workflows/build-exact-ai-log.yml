name: build-exact-ai-log

on:
  push:
    paths:
      - '.github/workflows/build-exact-ai-log.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assemble literal AI log
        run: python scripts/assemble_exact_ai_log.py
      - name: Remove one-time staging files
        run: |
          rm -rf ai-log/.parts
          rm -f scripts/assemble_exact_ai_log.py
          rm -f .github/workflows/build-exact-ai-log.yml
      - name: Commit exact log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: replace AI log with literal Claude responses"
          git push

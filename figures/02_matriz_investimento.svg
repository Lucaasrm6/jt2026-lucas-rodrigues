<rect x="610" y="95" width="300" height="42" rx="6" fill="#eef2f7"/>
<text x="625" y="112" class="small" text-anchor="start">Morretes 2Q: maior CEI entre os</text>
<text x="625" y="130" class="small" text-anchor="start">candidatos robustos do screen final.</text>
<text x="910" y="585" class="small" text-anchor="end">CEI = preço-noite exibido / preço-pedido.</text>

<text x="55" y="48" class="title" text-anchor="start">Matriz de investimento — candidatos finais</text>
<text x="55" y="74" class="sub" text-anchor="start">Mais acima = maior preço-noite exibido; mais à esquerda = menor capital de aquisição.</text>

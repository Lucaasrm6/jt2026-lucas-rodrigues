<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600">
<title>Matriz de investimento: preço-pedido versus preço-noite exibido</title>
<rect width="100%" height="100%" fill="#ffffff"/>
